kind = "web"
previewPath = "/"
title = "SchoolLife"
description = "A mobile-first family school communication hub that turns scattered school messages into a calm, actionable family plan with simulated demo interactions."
version = "1.0.0"
id = "artifacts/schoollife"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25129

[services.development]
run = "pnpm --filter @workspace/schoollife run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/schoollife", "run", "build" ]
serve = "static"
publicDir = "artifacts/schoollife/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25129"
BASE_PATH = "/"
